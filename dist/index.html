1fr;gap:18px}.column{display:flex;flex-direction:column;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px}.card h2{font:600 18px Georgia,serif;margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid #eee}.list{list-style:none;margin:0;padding:0}.list li{position:relative;padding:7px 0 7px 18px;line-height:1.55;color:#343434;font-size:14px}.list li:before{content:'•';position:absolute;left:0;color:#777}.people{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{border:1px solid #e6e6e6;border-radius:11px;padding:12px;font-size:13px;line-height:1.45}.person b{display:block;margin-bottom:3px}.person span{color:var(--sub)}.actions{background:#fffaf1;border-color:#ead9b9}.actions li:before{content:'□';color:var(--amber);font-weight:700}.empty{padding:70px 20px;text-align:center;color:var(--sub)}.footer{max-width:1240px;margin:auto;padding:0 28px 36px;color:#777;font-size:12px;display:flex;justify-content:space-between}.hidden{display:none!important}

 const complete=stores.filter(s=>s.kind==='complete').length, upcoming=stores.filter(s=>s.kind==='scheduled'||s.kind==='visit').length, planned=stores.filter(s=>s.kind==='planning').length, diffusers=stores.reduce((n,s)=>n+s.diffusers,0);
