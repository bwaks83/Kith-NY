stores.forEach(store=>store.manager=storeManagers[store.id]||'To be confirmed');
const storeContacts={
 'design-district':[{name:'Loren Jones',role:'Store Manager',email:'loren@kith.com'}],
 'miami-beach':[{name:'Kristy Hirshfield',role:'Store Manager',email:'kristy@kithnyc.com'}],
 'west-hollywood':[{name:'Malou Galopin',role:'Store Manager',email:'malou.galopin@kithnyc.com'}],
 rodeo:[{name:'Luke Schulz',role:'Store Manager',email:'luke@kithnyc.com'}],
 malibu:[{name:'Jessica Nava',role:'Store Manager',email:'jessica.nava@kithnyc.com'}],
 'mens-soho':[{name:'Armando Lopez',role:'Store Manager',email:'armando@kithnyc.com',phone:'646-884-4541'}],
 'womens-soho':[{name:'Angelica Suriel',role:'General Manager',email:'angelica@kithnyc.com',phone:'347-651-6945'}],
 williamsburg:[{name:'Nicole Vasquez',role:'Store Manager',email:'nicole.vasquez@kithnyc.com',phone:'347-285-7064'}],
 hawaii:[{name:'Ramsey Asuncion',role:'Store Manager',email:'ramsey@kithnyc.com'}],
 'kith-ivy':[{name:'Jack Skivington',role:'Store Manager',email:'jack@kithivy.com',phone:'929-330-0470'}]
};
stores.forEach(store=>store.contacts=storeContacts[store.id]||[]);
stores.find(store=>store.id==='south-beach-reno').status='2027';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const people=list=>list.length?list.map(p=>`<div class="person"><b>${esc(p.name)}</b><span class="role">${esc(p.role)}</span>${p.email?`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:'<span class="missing-contact">Email not confirmed</span>'}${p.phone?`<a href="tel:${esc(p.phone.replace(/[^+\d]/g,''))}">${esc(p.phone)}</a>`:'<span class="missing-contact">Phone not confirmed</span>'}</div>`).join(''):'<p class="contacts-empty">Store manager contact details have not yet been confirmed.</p>';
const items=list=>list.map(x=>`<li>${esc(x)}</li>`).join('');
const completedOrder=['mens-soho','malibu','west-hollywood','rodeo','design-district','miami-beach'];
const completedRank=new Map(completedOrder.map((id,index)=>[id,index]));
const groupStores=data=>({
 complete:data.filter(s=>s.kind==='complete').sort((a,b)=>completedRank.get(a.id)-completedRank.get(b.id)),
 next:data.filter(s=>s.status==='Site visit complete'||s.status==='Scheduled'),
 planning:data.filter(s=>s.kind!=='complete'&&s.status!=='Site visit complete'&&s.status!=='Scheduled')
});
const board=data=>{if(!data.length)return '<div class="empty">No stores found.</div>';const groups=groupStores(data);return `<section class="status-column lane-next"><div class="column-head"><h3>Next installations</h3><span>${groups.next.length}</span></div>${rows(groups.next)}</section><section class="status-column lane-planning"><div class="column-head"><h3>Future projects</h3><span>${groups.planning.length}</span></div>${rows(groups.planning)}</section><section class="status-column lane-complete"><div class="column-head"><h3>Installed</h3><span>${groups.complete.length}</span></div>${rows(groups.complete)}</section>`};
const bytes=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;
function lockedDocuments(storeId,message=''){
 const area=document.getElementById('documents-area');if(!area)return;
 area.innerHTML=`<div class="documents-lock"><p>Enter the project password to view this store’s private documents.</p><form class="documents-form" id="documents-unlock"><input type="password" name="password" autocomplete="current-password" placeholder="Project password" required><button class="documents-button" type="submit">View documents</button>${message?`<span class="documents-error">${esc(message)}</span>`:''}</form></div>`;
 document.getElementById('documents-unlock').addEventListener('submit',async event=>{event.preventDefault();const button=event.currentTarget.querySelector('button');button.disabled=true;const response=await fetch('/api/documents/unlock',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:new FormData(event.currentTarget).get('password')})});if(response.ok)loadDocuments(storeId);else lockedDocuments(storeId,'Incorrect password. Please try again.')});
}
async function loadDocuments(storeId){
 const area=document.getElementById('documents-area');if(!area)return;area.innerHTML='<p class="documents-note">Loading documents…</p>';
 try{const me=await fetch('/api/me').then(r=>r.json());if(!me.unlocked){lockedDocuments(storeId);return}const documents=await fetch(`/api/documents?store=${encodeURIComponent(storeId)}`).then(r=>{if(!r.ok)throw new Error();return r.json()});
 const upload=me.isOwner?`<form class="upload-form" id="documents-upload"><strong>Add document</strong><input type="file" name="file" required><input type="text" name="description" maxlength="180" placeholder="Description (optional)"><select name="category"><option>Plans</option><option>Installation</option><option>Commercial</option><option>Operations</option><option>Other</option></select><button class="documents-button" type="submit">Upload document</button><span id="upload-message"></span></form>`:'';
 const list=documents.length?documents.map(doc=>`<div class="document-row"><div><b>${esc(doc.filename)}</b><small>${esc(doc.category)}${doc.description?' · '+esc(doc.description):''} · ${bytes(doc.size)} · ${esc(new Date(doc.created_at).toLocaleDateString('en-US'))}</small></div><div class="document-actions"><a href="/api/documents/${encodeURIComponent(doc.id)}/download">Open</a>${me.isOwner?`<button type="button" data-delete="${esc(doc.id)}">Delete</button>`:''}</div></div>`).join(''):'<p class="documents-note">No documents have been added for this store.</p>';
 area.innerHTML=`<div class="documents-toolbar"><p class="documents-note">Private project files</p><button class="documents-button secondary" id="documents-lock" type="button">Lock</button></div>${upload}<div class="documents-list">${list}</div>`;
 document.getElementById('documents-lock').addEventListener('click',async()=>{await fetch('/api/documents/lock',{method:'POST'});lockedDocuments(storeId)});
 if(me.isOwner){const form=document.getElementById('documents-upload');form.addEventListener('submit',async event=>{event.preventDefault();const message=document.getElementById('upload-message');message.textContent='Uploading…';const data=new FormData(form);data.set('store_id',storeId);const response=await fetch('/api/documents',{method:'POST',body:data});if(response.ok)loadDocuments(storeId);else message.innerHTML='<span class="documents-error">Upload failed. Please try again.</span>'});area.querySelectorAll('[data-delete]').forEach(button=>button.addEventListener('click',async()=>{if(!confirm('Delete this document?'))return;const response=await fetch(`/api/documents/${encodeURIComponent(button.dataset.delete)}`,{method:'DELETE'});if(response.ok)loadDocuments(storeId)}))}
 }catch{area.innerHTML='<p class="documents-error">Documents are temporarily unavailable. Please try again.</p>'}
}
function listView(){
 const activeStores=stores.filter(s=>s.kind==='complete'), plannedStores=stores.filter(s=>s.kind!=='complete'), activeDiffusers=activeStores.reduce((n,s)=>n+s.diffusers,0), plannedDiffusers=plannedStores.reduce((n,s)=>n+s.diffusers,0), diffusers=stores.reduce((n,s)=>n+s.diffusers,0);
 document.title='Kith × Scent Company — Store Program';
 document.getElementById('app').innerHTML=`<div class="page"><div class="eyebrow">Retail scenting program</div><h1>Store rollout</h1><div class="intro"><p>A store-by-store view of installations, upcoming work, design coordination and the decisions needed to move each location forward.</p><label class="search">⌕<input id="q" placeholder="Search stores or cities" aria-label="Search stores or cities"></label></div><section class="metrics"><article class="metric"><span>Active Locations</span><strong>${activeStores.length}</strong></article><article class="metric"><span>Active Diffusers</span><strong>${activeDiffusers}</strong></article><article class="metric"><span>Planned Locations</span><strong>${plannedStores.length}</strong></article><article class="metric"><span>Planned Diffusers</span><strong>${plannedDiffusers}</strong></article></section><section class="panel"><div class="panel-head"><h2>All locations</h2><small><b id="count">${stores.length}</b> stores · ${diffusers} total diffusers</small></div><div id="rows">${board(stores)}</div></section></div>`;
 document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.toLowerCase(),found=stores.filter(s=>(s.name+' '+s.location+' '+s.status).toLowerCase().includes(q));document.getElementById('rows').innerHTML=board(found);document.getElementById('count').textContent=found.length});
}
function rows(data){return data.map(s=>`<a class="store ${s.kind}" href="?store=${encodeURIComponent(s.id)}"><span class="store-name"><strong>${esc(s.name)}</strong><small>${esc(s.location)}</small></span><span class="status ${s.kind}">${esc(s.status)}</span><span class="manager"><small>Store Manager</small><strong>${esc(s.manager)}</strong></span><span class="cell"><strong>${s.diffusers}</strong><small>diffusers</small></span><span class="cell"><strong>${esc(s.date)}</strong><small>target / completed</small></span><span class="arrow">›</span></a>`).join('')}
function detailView(s){document.title=`${s.name} — Kith Store Program`;document.getElementById('app').innerHTML=`<div class="page"><a class="back" href="${location.pathname}">← Back to all locations</a><section class="detail-head"><div><div class="eyebrow">${esc(s.location)}</div><h1>${esc(s.name)}</h1><div class="detail-meta"><span class="status ${s.kind}">${esc(s.status)}</span></div></div><div class="date-card"><span>Target / completed</span><strong>${esc(s.date)}</strong></div></section><section class="summary-strip"><div><span>Location</span><strong>${esc(s.address)}</strong></div><div><span>Store Manager</span><strong>${esc(s.manager)}</strong></div><div><span>System plan</span><strong>${s.diffusers} diffuser${s.diffusers===1?'':'s'}</strong></div><div><span>Scent</span><strong>${esc(s.scent)}</strong></div></section><div class="detail-grid"><div class="column"><section class="card"><h2>Current status & site notes</h2><ul class="list">${items(s.history)}</ul></section><section class="card"><h2>Shared documents</h2><ul class="list">${items(s.files)}</ul></section><section class="card documents-card"><h2>Documents</h2><div id="documents-area"></div></section></div><aside class="column"><section class="card"><h2>Project contacts</h2><div class="people">${people(s.contacts)}</div></section><section class="card actions"><h2>Next actions</h2><ul class="list">${items(s.actions)}</ul></section></aside></div></div>`;loadDocuments(s.id)}
const selected=new URLSearchParams(location.search).get('store');const store=stores.find(s=>s.id===selected);store?detailView(store):listView();
</script>
</body>
</html>
